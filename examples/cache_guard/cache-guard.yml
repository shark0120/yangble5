# cache-guard.yml — fail a pull request that makes a prompt cache-hostile.
#
# COPY THIS into .github/workflows/ in your repository, then commit one
# representative JSON/JSONL request fixture at prompts/cache-fixture.jsonl.
# Use two or more payloads whose cached prefix should be byte-identical and
# whose final user turn differs. Supported shapes: Anthropic Messages, OpenAI
# chat.completions, and OpenAI Responses.
#
# `main` makes the new action usable before its next release tag exists. Review
# the action, then pin this `uses:` line to the full commit SHA you approved.

name: cache-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  cache-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base-ref below must exist locally so the action can read the old
          # version of the same fixture without contacting any provider.
          fetch-depth: 0

      - name: Guard the prompt cache
        uses: shark0120/yangble5@main
        with:
          prompt-file: prompts/cache-fixture.jsonl
          base-ref: ${{ github.event.pull_request.base.sha }}
          # Optional: replace the action's explicitly labelled example price
          # with your own input-token price per million.
          # price-per-mtok: "YOUR_PRICE"
